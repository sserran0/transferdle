name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to read the base branch's schedule

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # scripts are plain .ts run by Node's built-in type stripping
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # tsc -b && vite build

      - name: Schedule is valid and append-only
        run: |
          BASE_REF="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
          if git show "$BASE_REF:src/data/schedule.json" > /tmp/base-schedule.json 2>/dev/null; then
            npm run schedule:check -- --base /tmp/base-schedule.json
          else
            echo "No schedule on $BASE_REF yet; checking structure only."
            npm run schedule:check
          fi
